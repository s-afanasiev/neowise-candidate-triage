<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки — разбор</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 44rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; color: #111; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    .hint { color: #555; margin: .25rem 0 0; }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    textarea { display: block; width: 100%; padding: .6rem; font: inherit; border: 1px solid #bbb; border-radius: .5rem; }
    button { padding: .5rem .9rem; font: inherit; border: 0; border-radius: .5rem; cursor: pointer; background: #1f6feb; color: #fff; }
    button:disabled { opacity: .6; cursor: progress; }
    button.secondary { background: #eaeef2; color: #111; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-top: .75rem; }
    .status { color: #555; min-height: 1.5em; }
    section { margin-top: 1.5rem; padding: 1rem; border: 1px solid #ddd; border-radius: .75rem; }
    section h2 { font-size: 1.1rem; margin: 0 0 .5rem; }
    .badge { display: inline-block; padding: .1rem .55rem; border-radius: 999px; background: #eaeef2; font-weight: 600; }
    .manual { border-color: #e0b400; background: #fff8e1; }
    .manual h2 { color: #7a5b00; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f6f8fa; padding: .6rem; border-radius: .5rem; margin: .25rem 0 .75rem; }
    #draft { background: #f6f8fa; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <p class="hint">Вставьте текст заявки. Анна предложит тему и черновик ответа — отправляет его менеджер.</p>

  <form id="triage-form" novalidate>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="5" placeholder="Например: когда придёт заказ?"></textarea>
    <div class="row">
      <button type="submit" id="submit">Разобрать заявку</button>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </div>
  </form>

  <section id="result" hidden aria-labelledby="result-title">
    <h2 id="result-title">Разбор готов</h2>
    <p>Тема: <span id="topic" class="badge"></span></p>
    <label for="draft">Черновик ответа</label>
    <textarea id="draft" rows="4" readonly></textarea>
    <div class="row">
      <button type="button" id="copy" class="secondary">Скопировать черновик</button>
    </div>
  </section>

  <section id="manual" class="manual" hidden aria-labelledby="manual-title">
    <h2 id="manual-title">Ручной разбор</h2>
    <p id="manual-reason"></p>
    <p class="hint">Текст заявки:</p>
    <pre id="manual-text"></pre>
    <label for="manual-reply">Ответ клиенту (вручную)</label>
    <textarea id="manual-reply" rows="4" placeholder="Напишите ответ…"></textarea>
    <div class="row">
      <button type="button" id="copy-manual" class="secondary">Скопировать ответ</button>
    </div>
  </section>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const form = $("triage-form");
    const message = $("message");
    const statusEl = $("status");
    const resultEl = $("result");
    const topicEl = $("topic");
    const draftEl = $("draft");
    const manualEl = $("manual");
    const manualReason = $("manual-reason");
    const manualText = $("manual-text");
    const manualReply = $("manual-reply");
    const submitBtn = $("submit");

    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };

    // Номер запроса: ответ применяем только если он всё ещё последний.
    // Ответы могут прийти в любом порядке, сообщения пользователя — по порядку.
    let requestSeq = 0;
    let latestRequest = 0;

    function clearOutput() {
      resultEl.hidden = true;
      topicEl.textContent = "";
      draftEl.value = "";
      manualEl.hidden = true;
      manualReason.textContent = "";
      manualText.textContent = "";
      manualReply.value = "";
    }

    function showReady(data) {
      clearOutput();
      topicEl.textContent = TOPIC_LABELS[data.topic] ?? data.topic;
      draftEl.value = data.draft;
      resultEl.hidden = false;
    }

    function showManual(reason, text) {
      clearOutput();
      manualReason.textContent = reason;
      manualText.textContent = text;
      manualEl.hidden = false;
      manualReply.focus();
    }

    async function copyText(value) {
      if (!value.trim()) return;
      try {
        await navigator.clipboard.writeText(value);
        statusEl.textContent = "Скопировано.";
      } catch {
        statusEl.textContent = "Не удалось скопировать — выделите текст вручную.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = message.value.trim();
      if (!text) {
        clearOutput();
        statusEl.textContent = "Введите текст заявки.";
        message.focus();
        return;
      }

      const my = ++requestSeq;
      latestRequest = my;
      clearOutput();
      statusEl.textContent = "Разбираю…";
      submitBtn.disabled = true;

      try {
        const response = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await response.json().catch(() => null);

        if (my !== latestRequest) return; // пришёл устаревший ответ

        if (response.status === 400 && data?.status === "invalid_input") {
          clearOutput();
          statusEl.textContent = "Пустая заявка — введите текст.";
          return;
        }

        if (!response.ok || data?.status === "manual_review") {
          showManual(
            "Не удалось разобрать заявку автоматически: модель не ответила или вернула неподходящий результат. Разберите вручную.",
            text,
          );
          return;
        }

        if (data?.status === "ready" && typeof data.draft === "string") {
          showReady(data);
          statusEl.textContent = "";
          return;
        }

        showManual("Сервис вернул неожиданный ответ. Разберите заявку вручную.", text);
      } catch {
        if (my !== latestRequest) return;
        showManual("Сервис недоступен. Разберите заявку вручную.", text);
      } finally {
        if (my === latestRequest) submitBtn.disabled = false;
      }
    });

    $("copy").addEventListener("click", () => copyText(draftEl.value));
    $("copy-manual").addEventListener("click", () => copyText(manualReply.value));
  </script>
</body>
</html>
